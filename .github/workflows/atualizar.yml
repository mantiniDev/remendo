name: Atualizar dados e publicar o site
on:
  schedule:
    - cron: "0 7 * * *"   # todo dia, 04h em Brasília
  workflow_dispatch:
    inputs:
      anos:
        description: "Anos a carregar, separados por espaço (vazio = ano atual e 2 anteriores)"
        required: false
        default: ""
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: remendo-pages
  cancel-in-progress: false
jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Restaurar banco
        uses: actions/cache/restore@v4
        with:
          path: remendo.db
          key: remendo-db-${{ github.run_id }}
          restore-keys: remendo-db-
      - name: Coletar e exportar
        run: python -u -m remendo_etl.run --max-minutos 300 ${ANOS:+--anos $ANOS}
        timeout-minutes: 330
        env:
          PORTAL_API_KEY: ${{ secrets.PORTAL_API_KEY }}
          ANOS: ${{ github.event.inputs.anos }}
      - name: Salvar banco
        if: always()
        uses: actions/cache/save@v4
        with:
          path: remendo.db
          key: remendo-db-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with: { name: dados-remendo, path: saida/ }
      - name: Montar o site (páginas + dados)
        run: |
          rm -rf _site && mkdir -p _site/dados
          cp -r site/. _site/
          cp saida/*.json saida/*.csv _site/dados/
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  publicar:
    needs: etl
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
